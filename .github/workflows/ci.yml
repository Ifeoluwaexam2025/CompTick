name: Backend checks

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:14
        env:
          POSTGRES_USER: dsrms_test
          POSTGRES_PASSWORD: disposable-ci
          POSTGRES_DB: dsrms_test
        ports:
          - 5432/tcp
        options: >-
          --health-cmd "pg_isready -U dsrms_test -d dsrms_test"
          --health-interval 5s
          --health-timeout 3s
          --health-retries 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '26'
          cache: npm
      - run: npm ci
      - run: npm run lint
      - run: npm test
        env:
          TEST_DATABASE_URL: postgresql://dsrms_test:disposable-ci@127.0.0.1:${{ job.services.postgres.ports[5432] }}/dsrms_test
